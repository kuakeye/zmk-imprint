manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Cyboard-DigitalTailor
      url-base: https://github.com/Cyboard-DigitalTailor
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Phase 2: build against the latest upstream ZMK main (Zephyr 4.1 stack).
      revision: main
      import: app/west.yml
    - name: zmk-keyboards
      remote: Cyboard-DigitalTailor
      # Cyboard's `zephyr-4.1` branch is the one they maintain for current ZMK
      # main / Zephyr 4.1: it uses the new hardware-model-v2 board layout
      # (boards/cyboard/assimilator-bt) and the renamed `cyboard,pmw3610`
      # trackball compatible. It transitively pulls zmk-pmw3610-driver at its
      # matching (startup_optimization) revision, so no driver override here.
      revision: zephyr-4.1
      import: config/west.yml
  self:
    path: config
